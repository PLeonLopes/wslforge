# wslforge settings: ./install.sh --config examples/wslforge.conf
# Plain KEY=value lines. The file is parsed, never executed.

# Modules to install (comma-separated). Empty = the default modules.
# "base" is always included. See all modules with: ./install.sh --list
MODULES=cli,git

# Global git identity. Leave empty to be asked (or to keep the current one).
GIT_NAME="Your Name"
GIT_EMAIL="you@example.com"
