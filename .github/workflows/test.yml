name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idempotency:
    name: Install twice (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:13']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: First run installs everything
        run: ./install.sh --yes

      # A second run must find every tool already installed and change nothing.
      - name: Second run changes nothing
        run: |
          set -o pipefail
          ./install.sh --yes | tee second-run.log
          if grep -q 'Installing:' second-run.log; then
            echo "::error::The second run tried to install something again."
            exit 1
          fi

  remote:
    name: Run through curl | bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Piping the script (no lib/ next to it) must download this exact
      # commit and run from there.
      - name: Piped install.sh downloads the repository
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          bash -s -- --list --ref "$REF" <"$GITHUB_WORKSPACE/install.sh" | tee remote.log
          grep -q 'Downloading wslforge' remote.log
          grep -q 'Claude Code' remote.log

  windows:
    name: Windows questionnaire (-Yes)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1, the version every Windows ships with.
      - name: install.ps1 -Yes writes a wslforge.conf
        shell: powershell
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'wslforge.conf'
          .\install.ps1 -Yes -OutFile $conf
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $lines = Get-Content $conf
          foreach ($key in 'WSL_DISTRO', 'WSL_NAME', 'WSL_LOCATION', 'WSL_USER', 'WSL_MEMORY_GB', 'WSL_CPUS', 'PROFILE') {
            if (-not ($lines -match "^$key=")) { throw "Missing $key in the generated config" }
          }
          $lines
