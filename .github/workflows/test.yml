name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Monthly (and on demand), every profile everywhere: catches distro or
  # upstream changes that break an install.
  schedule:
    - cron: '0 6 1 * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  idempotency:
    name: Install twice (${{ matrix.image }}, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'ubuntu:24.04'
          - 'debian:13'
          - 'fedora:latest'
          - 'almalinux:9'
          - 'archlinux:latest'
        # Pushes and pull requests: the default profile on every distro, plus
        # everything (full) on Ubuntu, to keep Actions time low. Monthly and
        # manual runs: full on every distro.
        profile: ${{ fromJSON(contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) && '["full"]' || '["dev"]') }}
        include:
          - image: 'ubuntu:24.04'
            profile: full
    defaults:
      run:
        shell: bash
    steps:
      # Minimal images may lack what actions/checkout needs to unpack the code.
      - name: Prepare the container
        run: |
          if command -v apt-get >/dev/null; then :
          elif command -v dnf >/dev/null; then dnf install -y tar gzip
          elif command -v pacman >/dev/null; then pacman -Sy --noconfirm --needed tar gzip
          fi

      - uses: actions/checkout@v5

      - name: First run installs everything
        run: ./install.sh --yes --profile ${{ matrix.profile }}

      # A second run must find every tool already installed and change nothing.
      - name: Second run changes nothing
        run: |
          set -o pipefail
          ./install.sh --yes --profile ${{ matrix.profile }} | tee second-run.log
          if grep -q 'Installing:' second-run.log; then
            echo "::error::The second run tried to install something again."
            exit 1
          fi

  remote:
    name: Run through curl | bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Piping the script (no lib/ next to it) must download this exact
      # commit and run from there.
      - name: Piped install.sh downloads the repository
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP"
          bash -s -- --list --ref "$REF" <"$GITHUB_WORKSPACE/install.sh" | tee remote.log
          grep -q 'Downloading wslforge' remote.log
          grep -qE '^ +claude +default' remote.log

  windows:
    name: Windows questionnaire (-Yes -ConfigOnly)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Windows PowerShell 5.1, the version every Windows ships with. The
      # runner cannot create WSL distros, so only the answers are tested.
      - name: install.ps1 -Yes -ConfigOnly writes a wslforge.conf
        shell: powershell
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'wslforge.conf'
          .\install.ps1 -Yes -ConfigOnly -Config $conf
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $lines = Get-Content $conf
          foreach ($key in 'WSL_DISTRO', 'WSL_NAME', 'WSL_LOCATION', 'WSL_USER', 'WSL_MEMORY_GB', 'WSL_CPUS', 'PROFILE') {
            if (-not ($lines -match "^$key=")) { throw "Missing $key in the generated config" }
          }
          $lines

      - name: install.ps1 -Resume reads the saved answers back
        shell: powershell
        run: |
          $conf = Join-Path $env:RUNNER_TEMP 'wslforge.conf'
          $before = Get-Content $conf | Where-Object { $_ -notmatch '^#' }
          .\install.ps1 -Yes -ConfigOnly -Resume -Config $conf
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited with $LASTEXITCODE" }
          $after = Get-Content $conf | Where-Object { $_ -notmatch '^#' }
          if (Compare-Object $before $after) { throw 'The answers changed after -Resume' }
